<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天下統一物語〜戦国編〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;--paper:#f2ebd9;--paper2:#e6dbc1;--card:#faf6ec;--ink:#2a2420;--ink2:#6e645a;--line:#cbbd9e;--red:#ad3329;--red2:#8f281f;--gold:#a87d24;--sea:#c3d3cf;--good:#2f5d34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--paper);-webkit-user-select:none;user-select:none}
.mc{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
.brush{font-family:"TenkaBrush","Yuji Syuku","Shippori Mincho B1","Hiragino Mincho ProN",serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#hdr{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:#f2ebd9;flex:0 0 auto;min-height:44px}
#hdr .date{font-size:18px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
#hdr .clan{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hdr .sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);flex:0 0 auto}
#hdr .res{margin-left:auto;display:flex;gap:10px;font-size:12px;white-space:nowrap}
#hdr .res b{font-size:15px;font-variant-numeric:tabular-nums}
#hdr .res span{opacity:.72}
#mapwrap{position:relative;flex:1 1 auto;min-height:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none}
#map .fill{stroke:none;cursor:pointer;transition:opacity .2s}
#map .fill.ezo{cursor:default}
#map .bd{fill:none;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round;stroke-linecap:round}
#map .bd.coast{stroke:#5b4a36;stroke-width:1px}
#map .bd.inner{stroke:rgba(40,30,20,.32);stroke-width:.7px}
#map .bd.clan{stroke:#241b14;stroke-width:1.9px}
#map .selo{fill:none;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke;pointer-events:none}
#map .selo2{fill:none;stroke:#1b1714;stroke-width:1.4px;vector-effect:non-scaling-stroke;pointer-events:none}
#map .tgto{fill:rgba(173,51,41,.18);stroke:#ad3329;stroke-width:2.4px;vector-effect:non-scaling-stroke;pointer-events:none;animation:tgt 1s ease-in-out infinite}
@keyframes tgt{50%{stroke-width:4px;fill:rgba(173,51,41,.32)}}
#map .dim{opacity:.38}
#map .lbl{pointer-events:none}
#map .lbl text{paint-order:stroke;stroke-linejoin:round}
#map .lbl .nm{font-size:10.5px;font-weight:700;fill:#1f1a16;stroke:rgba(250,246,236,.92);stroke-width:2.6px}
#map .lbl .tr{font-size:9.5px;fill:#3b332c;stroke:rgba(250,246,236,.9);stroke-width:2.4px;font-variant-numeric:tabular-nums}
#map .lbl .mk{font-size:10.5px;font-weight:800;font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;stroke:none}
#map .lbl .dot{fill:var(--red);stroke:#fff;stroke-width:1.2px}
#map .ezoL{font-size:13px;fill:#8a8070;font-weight:700;pointer-events:none}
#map .arrow{fill:none;stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none;animation:arrowIn .5s ease-out}
#map .arrow.lost{stroke-dasharray:6 5}
#map .ahead{pointer-events:none;animation:arrowIn .5s ease-out}
@keyframes arrowIn{from{opacity:0}to{opacity:1}}
#map .flash{fill:#fff;pointer-events:none;animation:flash 1s ease-out forwards}
@keyframes flash{from{opacity:.75}to{opacity:0}}
#mapbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#mapbtns button{width:40px;height:40px;border-radius:9px;background:rgba(250,246,236,.94);border:1px solid var(--line);font-size:20px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.14)}
#mapbtns button.sm{font-size:11px;font-weight:700;line-height:1.15}
#mapbtns button.next{background:var(--red);color:#fff;border-color:var(--red2)}
#banner{position:absolute;left:10px;right:60px;top:10px;background:var(--ink);color:#f2ebd9;border-radius:10px;padding:9px 12px;display:none;align-items:center;gap:10px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2}
#banner.on{display:flex}
#banner button{margin-left:auto;background:#f2ebd9;color:var(--ink);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
#ticker{position:absolute;left:10px;right:60px;top:10px;display:none;flex-direction:column;gap:4px;z-index:2;pointer-events:none}
#ticker.on{display:flex}
#ticker div{background:rgba(42,36,32,.88);color:#f6efe0;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;animation:tick .4s ease-out}
#ticker div b{color:#ffd88a}
@keyframes tick{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
#panel{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 12px 8px;min-height:112px;max-height:42vh;overflow:auto}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.ph .sw{width:12px;height:12px;border-radius:3px;align-self:center;flex:0 0 auto}
.ph b{font-size:20px}
.ph small{color:var(--ink2)}
.ph .tag{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.ph .tag.ally{background:#dbe8d6;color:var(--good)}
.ph .tag.todo{background:#f3d9d4;color:var(--red2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stats div{background:var(--paper);border-radius:8px;padding:5px 8px}
.stats span{display:block;font-size:11px;color:var(--ink2)}
.stats b{font-size:16px;font-variant-numeric:tabular-nums}
.stats i{font-style:normal;font-size:11px;color:var(--ink2)}
.cmds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cmd{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 2px 6px;text-align:center;font-weight:700;font-size:15px}
.cmd small{display:block;font-weight:400;font-size:10px;color:var(--ink2);margin-top:1px}
.cmd.atk{background:var(--red);color:#fff;border-color:var(--red2)}
.cmd.atk small{color:#f6d9d4}
.cmd:disabled{opacity:.36}
.hint{color:var(--ink2);font-size:13.5px;line-height:1.6}
.hint b{color:var(--ink)}
.trait{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:#efe3c8;color:#6b4f1d;margin:2px 0}
.rank{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.rk{display:flex;align-items:center;gap:6px;font-size:13px}
.rk .nm2{width:4.6em;font-weight:700;white-space:nowrap;overflow:hidden}
.rk .bar{flex:1;height:12px;background:var(--paper2);border-radius:4px;overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:4px}
.rk .n{width:4.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rk.bet .nm2::after{content:"★";color:var(--gold);margin-left:2px}
.ctrl{display:flex;gap:6px}
.ctrl button{flex:1;padding:9px 0;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:14px}
.ctrl button.on{background:var(--ink);color:#f2ebd9;border-color:var(--ink)}
#foot{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--paper2);border-top:1px solid var(--line)}
#foot button{flex:1;padding:10px 0;border-radius:9px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
#foot button.end{flex:1.7;background:var(--ink);color:#f2ebd9;border-color:var(--ink)}
#ov{position:fixed;inset:0;background:rgba(30,24,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
#ov.on{display:flex}
#md{background:var(--card);width:100%;max-width:540px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.2)}
#md h2{margin:0 0 10px;font-size:21px}
#md .acts{display:flex;gap:8px;margin-top:14px}
#md .acts button{flex:1;padding:12px 0;border-radius:10px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
#md .acts button.pri{background:var(--ink);color:#f2ebd9;border-color:var(--ink)}
#md .acts button.red{background:var(--red);color:#fff;border-color:var(--red2)}
.rep{margin:0;padding:0;list-style:none}
.rep li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.5}
.rep li.me{font-weight:600}
.rep li.good{color:var(--good)}
.rep li.bad{color:var(--red2)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.row .nm2{font-weight:700;min-width:4.6em}
.row .sub{font-size:12px;color:var(--ink2)}
.row .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.btn-s{padding:6px 10px;border-radius:7px;background:var(--ink);color:#f2ebd9;font-size:13px;font-weight:600;white-space:nowrap}
.btn-s:disabled{opacity:.35}
.pill{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.pill.ally{background:#dbe8d6;color:var(--good)}
.amt{text-align:center;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0}
.amt small{font-size:14px;font-weight:400;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--red);height:30px}
.quick{display:flex;gap:6px;margin-top:4px}
.quick button{flex:1;padding:8px 0;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-size:13px}
.join{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.join .jr{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:13px}
.join .jr .jn{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{padding:5px 8px;font-size:12px;background:var(--paper);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#f2ebd9}
.odds{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--paper);font-size:14px;display:flex;justify-content:space-between;align-items:center}
.odds b{font-size:18px}
.bars{margin:10px 0}
.bar2{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar2 .lb{width:5em;font-weight:700}
.bar2 .tk{flex:1;height:14px;background:var(--paper2);border-radius:4px;overflow:hidden;position:relative}
.bar2 .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar2 .tk i.lost{opacity:.28}
.bar2 .n{width:7.5em;text-align:right;font-variant-numeric:tabular-nums}
.verdict{font-size:20px;font-weight:800;text-align:center;margin:8px 0 2px}
.note{font-size:12.5px;color:var(--ink2);line-height:1.65}
.help p{margin:0 0 10px;line-height:1.7;font-size:14px}
.help b{color:var(--red2)}
.help .cr{font-size:11.5px;color:var(--ink2);line-height:1.6;border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.regs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.regs button{padding:14px 0;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.toggle button{padding:6px 14px;border-radius:99px;background:var(--paper2);font-weight:700}
.toggle button.on{background:var(--ink);color:#f2ebd9}
.scr{position:fixed;inset:0;z-index:20;background:var(--paper);display:none;flex-direction:column;overflow:auto}
.scr.on{display:flex}
#title{align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 32%,#f8f2e4 0%,var(--paper) 55%,#e2d4b4 100%)}
#title .ttl{font-size:clamp(44px,13vw,64px);line-height:1.1;margin:0;letter-spacing:.06em;color:#1f1915}
#title .sub2{font-size:clamp(20px,6vw,28px);margin:6px 0 4px;color:var(--red2);letter-spacing:.2em}
#title .tag2{color:var(--ink2);margin:6px 0 30px;letter-spacing:.18em;font-size:12.5px}
#title .big{display:block;width:250px;margin:9px auto;padding:13px 0;border-radius:12px;font-size:17px;font-weight:700;background:var(--ink);color:#f2ebd9}
#title .big.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
#title .big.spec{background:var(--red);border-color:var(--red2);color:#fff}
#title .foot2{margin-top:22px;font-size:12px;color:var(--ink2);line-height:1.8}
#title .snd{margin-top:10px;font-size:13px;color:var(--ink2);text-decoration:underline}
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;border-radius:9px;font-family:"Shippori Mincho B1",serif;font-weight:800;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
#sel,#spsel{padding:16px 14px 30px}
#sel h2,#spsel h2{margin:4px 0 4px;font-size:24px}
.lead{color:var(--ink2);font-size:13px;margin:0 0 12px;line-height:1.6}
.dc{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.dc.picked{outline:2.5px solid var(--gold)}
.dc .em{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;flex:0 0 auto;font-family:"Shippori Mincho B1",serif}
.dc .t{font-weight:800;font-size:17px}
.dc .t small{font-weight:400;font-size:12px;color:var(--ink2);margin-left:4px}
.dc .s{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.5}
.dc .st{margin-left:auto;text-align:right;font-size:11px;color:var(--ink2);white-space:nowrap;padding-left:6px}
.dc .st b{display:block;color:var(--gold);font-size:13px;letter-spacing:1px}
.dc .st .od{display:block;font-size:17px;font-weight:800;color:var(--red2)}
.stickyb{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.stickyb button{width:100%;padding:14px 0;border-radius:12px;font-size:16px;font-weight:700;background:var(--ink);color:#f2ebd9;margin-top:6px}
.stickyb button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.retro{background:#14204a;color:#f4f4f4;border:3px solid #e8e8e8;border-radius:6px;padding:16px;font-size:20px;text-align:center;letter-spacing:.08em;box-shadow:0 0 0 3px #14204a}
.retro .yn{display:flex;justify-content:center;gap:28px;margin-top:14px}
.retro .yn button{color:#fff;font-size:22px;padding:4px 14px;border-radius:4px}
.retro .yn button:first-child{background:#2c4aa8}
#ending{position:fixed;inset:0;z-index:60;display:none;background:#cfdcd7;overflow:hidden}
#ending.on{display:block}
#ending #endMap{position:absolute;inset:0;width:100%;height:100%}
#ending .veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(20,14,10,.15),rgba(20,14,10,.78));opacity:0;transition:opacity 1.2s}
#ending.dark .veil{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ending .ttlbox{position:absolute;left:0;right:0;top:16%;text-align:center;pointer-events:none}
#ending .bigk{display:inline-block;font-size:min(23vw,150px);line-height:1;color:#fffaf0;text-shadow:0 0 18px rgba(255,214,140,.45),0 4px 18px rgba(0,0,0,.5);clip-path:inset(0 100% 0 0);transition:clip-path 1.4s cubic-bezier(.6,.05,.2,1)}
#ending.k .bigk{clip-path:inset(0 0 0 0)}
#ending .stamp{position:absolute;right:12%;top:calc(16% + min(23vw,150px) - 10px);width:min(20vw,120px);height:min(20vw,120px);font-size:min(12vw,72px);opacity:0;transform:scale(3) rotate(-24deg)}
#ending.s .stamp{animation:stamp .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(3) rotate(-24deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
#ending.shake .ttlbox{animation:shake .4s}
@keyframes shake{20%{transform:translate(-4px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,2px)}}
#ending .sub3{color:#ffe9b8;font-size:15px;letter-spacing:.3em;margin-top:10px;opacity:0;transition:opacity 1s}
#ending.k .sub3{opacity:1}
#ending .card{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:540px;background:rgba(250,246,236,.97);border-radius:18px 18px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .8s cubic-bezier(.2,.9,.3,1);max-height:62vh;overflow:auto}
#ending.c .card{transform:none}
#ending .card h3{margin:0 0 4px;font-size:22px}
#ending .card .ttl3{color:var(--red2);font-weight:800;font-size:15px;margin-bottom:8px}
#ending .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;line-height:1.55}
#ending .kv span{color:var(--ink2);white-space:nowrap}
#ending .epi{margin:10px 0 4px;font-size:14.5px;line-height:1.8;font-family:"Shippori Mincho B1",serif}
#ending .acts2{display:flex;gap:8px;margin-top:12px}
#ending .acts2 button{flex:1;padding:12px 0;border-radius:10px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
#ending .acts2 button.pri{background:var(--ink);color:#f2ebd9}
#ending .hit{display:inline-block;background:var(--gold);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;margin-left:6px}
#ending .skip{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));background:rgba(0,0,0,.35);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px}
.lbl[data-v="mark"] .nm,.lbl[data-v="mark"] .tr{display:none}
.lbl[data-v="none"]{display:none}
.lbl .mkb{stroke:#fff;stroke-width:1px}
.lbl.sel .mkb{stroke:#1b1714;stroke-width:2px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#map .hlo{fill:rgba(255,214,120,.22);stroke:#e0a020;stroke-width:2.6px;vector-effect:non-scaling-stroke;pointer-events:none;animation:tgt2 1.2s ease-in-out infinite}
@keyframes tgt2{50%{stroke-width:4px;fill:rgba(255,214,120,.38)}}
#dvbar{position:absolute;left:10px;right:60px;top:10px;background:var(--ink);color:#f2ebd9;border-radius:10px;padding:8px 10px;display:none;align-items:center;gap:8px;font-size:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3}
#dvbar.on{display:flex}
#dvbar .dvt{flex:1;line-height:1.35}
#dvbar .dvt .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#dvbar small{opacity:.8}
#dvbar button{background:#f2ebd9;color:var(--ink);border-radius:7px;padding:7px 10px;font-size:13px;font-weight:700;white-space:nowrap}
#dvbar button.pri{background:var(--red);color:#fff}
#dvbar button:disabled{opacity:.4}
.btn-s.sec{background:var(--paper2);color:var(--ink)}
#title .ver{margin-top:10px;font-size:11px;color:var(--ink2);letter-spacing:.1em}
#hdr .hq{margin-left:auto;flex:0 0 auto;background:transparent;border:1px solid rgba(242,235,217,.55);color:#f2ebd9;border-radius:6px;padding:4px 9px;font-size:12px;line-height:1.2;cursor:pointer}
body.sp #hdr .hq,#hdr .hq[hidden]{display:none}
#notice .nbox{max-width:460px;margin:0 auto;text-align:left;line-height:1.75}
#notice .warn{background:#fff3cd;border:1px solid #e0b84a;color:#5a4300;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}
#title{justify-content:flex-start}
#title>*{flex-shrink:0}
#title::before,#title::after{content:"";flex:1 0 0}
#title{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media (max-height:760px){
  #title .ttl{font-size:clamp(40px,11.5vw,56px)}
  #title .tag2{margin:4px 0 16px}
  #title .big{margin:6px auto;padding:11px 0;font-size:16px}
  #title .tmenu{margin-top:10px}
  #title .tmenu .tm{padding:8px 4px}
  #title .foot2{margin-top:12px}
  #tProf{margin-bottom:10px}
}
#hdr .date .hsc{display:block;font-size:9.5px;font-weight:600;letter-spacing:.08em;opacity:.75;line-height:1.1;margin-top:1px;font-family:inherit}
.sctag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--paper2);border-radius:99px;padding:1px 9px;margin:0 6px 4px 0;letter-spacing:.03em;white-space:nowrap;vertical-align:1px}
.sccs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:9px;margin-bottom:8px}
.scc{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 13px;color:var(--ink);font:inherit;cursor:pointer}
.scc .sct{display:flex;align-items:baseline;gap:10px}
.scc .yr{font-size:28px;font-weight:800;line-height:1;color:var(--red2);font-variant-numeric:tabular-nums}
.scc .nm{font-size:20px;font-weight:800;line-height:1.2}
.scc .ds{display:block;font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:7px}
.scc .lk{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;font-weight:700;color:var(--red2);background:#f3e2dc;border-radius:6px;padding:2px 8px}
.scc .lk svg{width:12px;height:12px;flex:0 0 auto}
.scc.lock{background:#ece4d2;border-style:dashed}
.scc.lock .yr,.scc.lock .nm{color:#8c8174}
.retro .rsub{font-size:12.5px;letter-spacing:.06em;opacity:.88;margin-bottom:10px}
#ending .card .sctag{margin:2px 0 6px}
.dc .st .od.od0{font-size:13px;color:var(--ink2);margin-bottom:2px}
#tProf{min-height:0;margin:0 auto 14px;font-size:12.5px;color:var(--ink2)}
#tProf:empty{display:none}
.tmenu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,86vw);margin:14px auto 0}
.tmenu:empty{display:none}
.tmenu .tm{position:relative;padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.2}
.tmenu .tm:active{transform:translateY(1px)}
.tmenu .tmb{position:absolute;top:-6px;right:-4px;min-width:18px;padding:1px 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700}
#sheet{padding:0}
#sheet .shHdr{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ink);color:#f2ebd9;min-height:48px}
#sheet .shHdr h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet .shb{color:#f2ebd9;font-size:14px;font-weight:700;padding:6px 10px 6px 4px;white-space:nowrap}
#shBody{flex:1 1 auto;overflow:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.setrow{padding:12px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sl{display:flex;align-items:center;gap:10px}
.setrow .sl b{font-size:15px}
.setrow .sl .r{margin-left:auto}
.setrow .sd{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.6}
.tog{min-width:64px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--ink);font-weight:700;font-size:13px;background:transparent;color:var(--ink)}
.tog.on{background:var(--ink);color:#f2ebd9}
.colent{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.colent b{display:block;font-size:18px;margin-bottom:3px}
.colent span{font-size:12.5px;color:var(--ink2)}
#ending .xtra{margin-top:10px}

.acc-prof{display:inline-flex;flex-direction:column;align-items:center;gap:3px;max-width:min(330px,90vw);padding:7px 16px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(250,246,236,.78)}
.acc-p1{display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%}
.acc-p1:empty{display:none}
.acc-nm{font-size:15.5px;font-weight:800;color:var(--ink);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-p2{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-p2 b{margin-left:2px;font-size:14px;color:var(--ink)}
.acc-chip{display:inline-block;flex:0 0 auto;padding:0 8px;border-radius:99px;background:var(--paper2);color:var(--ink2);font-size:11px;font-weight:700;line-height:18px;white-space:nowrap}
.acc-in{display:block;width:100%;margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.acc-in:focus{outline:none;border-color:var(--ink)}
.acc-err{min-height:1.5em;margin-top:5px;font-size:12.5px;line-height:1.5;color:var(--red2)}
.acc-cur{margin-right:8px;font-weight:700}
.acc-ttl{display:inline-block;margin-top:2px;white-space:nowrap;padding:0 6px;border:1px solid rgba(143,40,31,.35);border-radius:4px;font-size:11px;color:var(--red2)}
.acc-award{margin-top:8px;padding:9px 12px;border:1px solid #dcc58f;border-radius:10px;background:#f3e6c4}

  <div class="sub2 brush">〜戦国編〜</div>
  <div class="tag2">群雄割拠の世、統ぶるは汝か。</div>

  <div id="tMenu2" class="tmenu"></div>
  <div class="foot2">永禄三年（1560年）春。<br>四十一の大名家と国人衆が、七十三の国を争う。</div>
  <div class="ver">Ver.3.2a</div>

<div class="scr" id="sel">
  <h2 class="mc" id="selTtl">大名を選ぶ</h2>
  <p class="lead" id="selLead">★が多いほど難しくなります。当主は1560年春の時点の人物です。迷ったら織田家（一国からの成り上がり）がおすすめ。</p>
  <div id="selList"></div>
  <div class="stickyb"><button class="sec" id="selBack">戻る</button></div>
</div>
<div class="scr" id="spsel">
  <h2 class="mc" id="spTtl">観戦モード</h2>
  <p class="lead" id="spLead">AIの大名どうしが天下を争う様子を眺めます。始める前に、どの家が天下統一するかを予想できます（倍率は事前のシミュレーションから算出）。観戦の途中で好きな家に乗り換えて参戦することもできます。</p>
  <div id="spList"></div>
  <div class="stickyb"><button id="spGo">予想せずに観戦する</button><button class="sec" id="spBack">戻る</button></div>
</div>

key(S.player,d)]<=2)}function openDiplo(){if(mode)cancelMode();const st=S.d[S.player],nbs=new Set(neighborClans(S.player));const ds=aliveClans().filter(d=>d!==S.player).sort((a,b)=>nbs.has(b)-nbs.has(a)||troopsOf(b)-troopsOf(a));const rows=ds.map(d=>{const a=allied(S.player,d);return`<div class="row"><span class="sw" style="background:${CL[d].c}"></span><span class="nm2">${CL[d].n}</span><span class="sub">${provsOf(d).length}国・兵${fmt(troopsOf(d))}${nbs.has(d)?"・隣国":""}</span><span class="r">${relPill(d)}<button class="btn-s sec" data-m="${d}">地図</button><button class="btn-s" data-d="${d}" ${canPropose(d)?"":"disabled"}>${a?"延長":"同盟"}</button></span></div>`}).join("");const md=modal("外交",`<div class="note">米を贈って同盟を申し込みます（一季に一度）。最低でも米${COST.gift}が必要で、多く贈るほど受けてもらいやすくなります。贈った米は断られても戻りません。兵が多いほど通りやすく、攻めた相手や申し出を断った相手には通りにくくなります。同盟は${ALLY_LEN}季（2年）続きます。${tv(S.player,"diplo",0)?"<br>特性により成功率+20%。":""}${S.diplo?"<br><b>この季節はもう外交済みです。</b>":st.rice<COST.gift?`<br><b>米が${COST.gift}以上ないと申し込めません。</b>`:""}</div>${rows}`,[{t:"閉じる"}]);md.querySelectorAll(".btn-s[data-d]").forEach(b=>b.onclick=()=>openGift(b.dataset.d));md.querySelectorAll(".btn-s[data-m]").forEach(b=>b.onclick=()=>showDiploMap(b.dataset.m,"out"))}function openGift(d){const st=S.d[S.player],maxX=Math.max(0,Math.floor((st.rice-COST.gift)/100)*100);const md=modal(`${CL[d].n}家へ同盟を申し込む`,`<div class="note">${name(d)}（${provsOf(d).length}国・兵${fmt(troopsOf(d))}）。基本の贈り物は米${COST.gift}。上乗せするほど受けてもらいやすくなります（米1,000ごとに+10%、最大+40%）。贈った米は戻りません。</div>${traitTag(d)}\n    <div class="amt" id="gV"></div><input type="range" id="gR" min="0" max="${maxX}" step="100" value="0" ${maxX?"":"disabled"}>\n    <div class="odds"><span>受けてもらえる見込み</span><b id="gP"></b></div>`,[{t:"地図で見る",fn:()=>showDiploMap(d,"out")},{t:"やめる"},{t:"申し込む",cls:"pri",fn:()=>sendGift(d,+$("#gR").value)}]);const r=md.querySelector("#gR");const upd=()=>{const x=+r.value;md.querySelector("#gV").innerHTML=`米${fmt(COST.gift+x)}<small>（上乗せ ${fmt(x)}）</small>`;md.querySelector("#gP").textContent=`約${Math.round(acceptChance(S.player,d,x)*100)}%`};r.oninput=upd;upd()}function sendGift(d,x){const ok=cPropose(d,x);save();render();ok?winSfx():loseSfx();if(ok)BUS.emit("player:ally",{clan:d});modal("外交の結果",`<div class="verdict mc" style="color:${ok?"var(--good)":"var(--red2)"}">${ok?name(d)+"が同盟を受け入れた":name(d)+"に断られた…"}</div><div class="note" style="text-align:center">${ok?ALLY_LEN+"季のあいだ互いに攻め込めません。":"贈った米は戻りません。"}</div>`,[{t:"閉じる",cls:"pri"}])}$("#fDip").onclick=openDiplo;function showOke(e,next){taiko(0,1);taiko(.4,.8);modal("桶狭間の戦い",`<div class="verdict mc">今川義元、討ち死に</div><div class="note" style="text-align:center">今川家は子の氏真が継いだ（武勇64・特性なし）。${e.indep?"<br>この混乱に乗じ、松平元康（のちの徳川家康）が<b>三河で独立</b>した。":""}</div>`,[{t:"閉じる",cls:"pri",fn:next}],{lock:true})}function powerRows(){const ds=aliveClans().sort((a,b)=>provsOf(b).length-provsOf(a).length||troopsOf(b)-troopsOf(a));return ds.map(d=>`<div class="row"><span class="sw" style="background:${CL[d].c}"></span><span class="nm2">${CL[d].n}${d===S.player?"（自）":""}</span><span class="sub">${provsOf(d).length}国・石高${fmtK(kokuOf(d))}・兵${fmt(troopsOf(d))}</span><span class="r">${S.player?relPill(d):""}</span></div>`).join("")}$("#fPow").onclick=()=>{const dead=scenClans().filter(d=>S.d[d]&&!S.d[d].alive).map(d=>CL[d].n).join("・"),kj=provsOf(KJ).length;modal("勢力図",(typeof SHOP!=="undefined"&&SHOP&&SHOP.tobakuLine?SHOP.tobakuLine():"")+powerRows()+`<div class="note" style="margin-top:8px">${kj?`国人衆の国：${kj}<br>`:""}${dead?`滅亡：${dead}`:""}</div>`,[{t:"閉じる"}])};$("#fLog").onclick=()=>modal("記録",`<ul class="rep">${S.log.slice(0,80).map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`,[{t:"閉じる"}]);function helpHtml(){return`<div class="help">\n<div class="toggle"><span>効果音</span><button id="sndT" class="${AU.on?"on":""}">${AU.on?"オン":"オフ"}</button></div>\n<p><b>目的</b>　日本の73か国をすべて手に入れれば天下統一。自分の国がなくなれば滅亡です。始まりはシナリオで選びます（1560年 群雄割拠は永禄3年春）。国境は江戸時代末期の令制国の境界で、陸奥・出羽は明治初年の分け方で7か国にしています。</p>\n<p><b>シナリオ</b>　${scenList().map(x=>`${x.year}年 ${esc(x.name)}`).join("・")}。国の持ち主と大名・当主は、その年の状況に合わせています。石高は簡略化のため、どのシナリオも慶長3年（1598）の値です。1560年のほかは交換所で300両と交換すると遊べます。桶狭間などの出来事は1560年だけです。</p>\n<p><b>季節ごとに命令</b>　春夏秋冬で1ターン。自分の国ひとつにつき、一季に一つ命令できます。右の「次へ」で命令待ちの国を順に回れます。命令しなかった国は、季節を終えるときに「おまかせ」でAIに内政を任せられます。</p>\n<p><b>出陣</b>　隣の国へ攻め込みます。隣にある自分の国からも兵を出せる「合流出陣」もできます。相手の兵を全滅させれば国が手に入ります。守る側は城の値だけ強くなり、出陣の画面で勝てる見込み（勝率）を確認できます。</p>\n<p><b>武勇</b>　大名ごとの戦の強さです。合戦では兵1人あたりの強さが武勇に比例します（例：武勇98の兵は武勇60の兵の約1.6倍）。攻めにも守りにも効きます。</p>\n<p><b>特性</b>　主な大名家には1つずつ特性があります（例：武田「騎馬軍団」攻め+15%、北条「四公六民の善政」兵の維持費−25%、毛利「謀神」同盟が通りやすい）。大名を選ぶ画面と、相手の国をタップした時に表示されます。</p>\n<p><b>徴兵・開墾・築城・輸送</b>　米を使って兵を増やす／石高を上げる／城を固める。徴兵は兵1人に米0.5。徴兵できる人数は国ごとに石高×120人までですが、輸送すればそれ以上の兵も置けます。開墾は米400で石高+3〜5万石（伸びしろは元の石高の約2倍＋3万石まで）。築城は米500で城+10。城が50以上の国は、徴兵できる人数が2割増し、その国の兵の維持費が3割安くなります。</p>\n<p><b>兵糧</b>　米は毎季入ります：春の役銭（石高×15）、夏の麦（石高×30）、秋の収穫（石高×100。豊作・凶作あり）。冬は入りません。兵は4人で毎季米1を食べ、米が尽きると兵が逃げます。</p>\n<p><b>外交</b>　米を贈って同盟を申し込めます（最低米500、上乗せするほど通りやすい）。贈った米は断られても戻りません。逆に申し込まれたときは、断っても贈り物の米をもらえますが、相手に恨まれます。米が500ないと申し込めません。「地図」で相手の領地を確かめられます。同盟中は互いに攻め込めません。武田・北条・今川の甲相駿三国同盟など、そのシナリオの年の同盟から始まります。</p>\n<p><b>桶狭間</b>　1560〜61年に尾張か三河で今川家が織田家に敗れると、今川義元が討たれることがあります。そのとき三河は松平元康（のちの徳川家康）の松平家として独立します。1560年夏には史実どおり今川軍が尾張へ攻めてきます。</p>\n<p><b>国人衆</b>　大名がいない国衆の国です（1560年は伊賀・志摩・佐渡・壱岐）。攻めてはきませんが、奪わないと天下統一になりません。</p>\n<p><b>操作</b>　地図はドラッグで移動、ピンチか＋－で拡大。「地方」で各地方へ移動できます。進行は自動で保存されます。</p>\n<p><b>戦功と両</b>　天下統一すると戦功と両がもらえます（統一番付の点数と同じ）。1,000 ×★の倍率（★1＝1.0〜★5＝3.0）×早さの倍率です。早さは1590年春で1.0（1560年。ほかのシナリオは開始から30年で1.0）、1季早いごとに＋1.25%（1年で＋5%）、最大2.5倍。遅れると下がり、1600年春以降は0.5倍です（ほかのシナリオは開始から40年以降）。シナリオごとに、途中参戦でない初めての天下統一には、初回クリアボーナスの3,000両が付きます（1回だけ。戦功には足しません）。両は交換所と観戦の予想に使います。</p>\n<p><b>統一番付</b>　天下統一するとその場で名前を入れて、統一番付に載せられます。「ハイスコア」には遊んだ人それぞれの最高点が、「最速」には開始から統一までの早さ（同じなら★の多い方）が、シナリオごとに並びます。「累計」にはログインした人が載せた点数の合計（全シナリオ）が並びます。ログインしていないときは、名前の後に（guest）と出ます（累計には入りません）。途中参戦の統一は載りません。</p>\n<p><b>交換所・収集・記録帳</b>　両で地図の装い・統一演出・印・称号・旗印・宝物・BGMと交換できます（勝ちやすくなる品はありません）。「収集」では家紋帳・宝物蔵・旗印を見られます。「記録帳」には統一・滅亡と予想した観戦の結果が残り、勢力図の移り変わりを再生できます。</p>\n<p><b>賭場</b>　新しく始めるとき（出陣の時）に、自分の家の天下統一に両を賭けられます。倍率は★1〜3が2倍、★4が2.5倍、★5が3倍で、統一すると賞金とは別に賭け金×倍率が払い戻されます。賭け金は所持の80%まで（100両単位）。滅亡したとき、開始から140年（1560年なら1700年）になっても統一できなかったとき、新しく始めて上書きしたときは戻りません。中断して続きから遊んでも賭けは続きます。途中参戦では賭けられません。勢力の画面で賭けた額を確かめられます。</p>\n<p><b>観戦の予想</b>　統一する家を予想して両を賭けられます（10〜1,000両）。途中参戦すると予想は無効になり、賭け金は返されます。途中参戦で統一したときは、両はもらえますが戦功は得られません。</p>\n<div class="cr">国境データ：「幕末明治地勢地図境界データ」（人間文化研究機構, CC BY-NC 4.0 https://creativecommons.org/licenses/by-nc/4.0/）を加工して作成（kscsproj「令制国・郡・現代行政区域」の公開データ経由）。<br>石高：慶長3年（1598）国別石高（『日本国総目録』）。陸奥・出羽は明治初年の国別石高の比率で按分、壱岐・対馬は概算。<br>大名と当主：各シナリオの開始の時点（1560年は春）。国の中で勢力が割れていた所は、最有力の家（決めがたい所はのちにその国をまとめた家）を置いています。</div>\n${UIX.creditsHtml()}</div>`}function openHelp(){const md=modal("遊び方",helpHtml(),[{t:"閉じる"}]);const b=md.querySelector("#sndT");b.onclick=()=>{setSound(!AU.on);b.classList.toggle("on",AU.on);b.textContent=AU.on?"オン":"オフ"}}$("#fHelp").onclick=openHelp;function showScr(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id))}function setUIMode(m){const sp=m==="spect";const fx=$("#gFx");if(fx)fx.innerHTML="";$("#foot").style.display=sp?"none":"";$("#ticker").classList.toggle("on",sp);$("#znext").style.display=sp?"none":"";if(!sp)$("#ticker").innerHTML=""}const stars=n=>"★".repeat(n)+`<span style="color:#d6cbb3">${"★".repeat(5-n)}</span>`;function uiOwns(id){try{return!!(typeof META!=="undefined"&&META&&typeof META.owns==="function"&&META.owns(id))}catch(e){return false}}const uiScenOwned=id=>String(id)==="1560"||uiOwns("scen-"+id);const SCEN_PRICE=300;function uiPrice(id,def){try{const it=typeof META!=="undefined"&&META&&typeof META.item==="function"&&META.item(id);if(it&&it.price>0)return it.price}catch(e){}return def}function uiScen(id){return scenInfo(id)||{id:String(id),name:String(id||""),year:SC.start.year,season:SC.start.season}}const uiScenTag=id=>{const x=uiScen(id);return`${x.year} ${esc(x.name)}`};function uiEv(){const id=S&&S.scen||"1560",x=uiScen(id);return{scen:x.id,scenName:x.name,startYear:x.year,startSeason:x.season}}const uiLock=(id,def)=>`<span class="lk"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 7V5.3a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="7" width="10" height="8" rx="1.6" fill="currentColor"/></svg>交換所で${num(uiPrice(id,def))}両</span>`;function uiAskShop(label,id,def,cat){const shop=typeof SHOP!=="undefined"&&SHOP&&typeof SHOP.open==="function";modal("まだ選べません",`<div class="note">「${label}」は、交換所で${num(uiPrice(id,def))}両と交換すると遊べます。</div>`,shop?[{t:"閉じる"},{t:"交換所へ",cls:"pri",fn:()=>SHOP.open(cat)}]:[{t:"閉じる",cls:"pri"}])}const uiScenCard=(x,own)=>`<button type="button" class="scc${own?"":" lock"}" data-s="${esc(x.id)}"><span class="sct"><span class="yr mc">${x.year}</span><span class="nm mc">${esc(x.name)}</span></span>${own?"":uiLock("scen-"+x.id,SCEN_PRICE)}<span class="ds">${esc(x.desc||"")}</span></button>`;const NG={scen:"1560",step:null};function selPage(step,ttl,lead,html,keep){NG.step=step;$("#selTtl").textContent=ttl;$("#selLead").innerHTML=lead;$("#selList").innerHTML=html;if(!keep){showScr("sel");$("#sel").scrollTop=0}return $("#selList")}function openSelect(){NG.scen="1560";openScenSel()}function openScenSel(keep){useScenario("1560");const list=scenList(),locked=list.some(x=>!uiScenOwned(x.id));const box=selPage("scen","シナリオを選ぶ","どの年から天下を目指すかを選びます。"+(locked?"鍵のついたシナリオは、交換所で両と交換すると遊べます。":""),`<div class="sccs">${list.map(x=>uiScenCard(x,uiScenOwned(x.id))).join("")}</div>`,keep);box.querySelectorAll(".scc").forEach(b=>b.onclick=()=>{const x=uiScen(b.dataset.s);if(!uiScenOwned(x.id))return uiAskShop(`${x.year} ${esc(x.name)}`,"scen-"+x.id,SCEN_PRICE,"scen");NG.scen=x.id;openClanSel()})}function initialPreview(){return scenPreview(SC.id)}function allyNames(d){return SC.alliances.filter(a=>a[0]===d||a[1]===d).map(a=>CL[a[0]===d?a[1]:a[0]].n)}function openClanSel(keep){const sid=NG.scen;useScenario(sid);const x0=uiScen(sid),list=initialPreview().filter(x=>x.n>0&&CL[x.d]).sort(( nk?`（${rank}位）`:""}</div><button class="hs-ok" type="button">ハイスコア表を見る</button>`;box.querySelector(".hs-ok").onclick=open}});function keep(p,name){const a=load();a.push(Object.assign({name:[...name].slice(0,NAME_MAX).join(""),at:Date.now()},p));store(sorted(a));try{localStorage.setItem(KEY+"-last",name)}catch(e){}return sorted(load()).findIndex(e=>e.gid===p.gid&&e.at&&e.name===name)+1}const NOTE=`<div class="note">天下統一したときの点数です（★が多い家ほど、早く統一するほど高い）。この端末にだけ残ります。途中参戦と開発者モードの統一は入りません。</div>`;function listHtml(){const a=sorted(load());return a.length?`<ol class="hs-list">${a.map((e,i)=>`<li><span class="hs-r">${i+1}</span><span class="hs-n">${esc(e.name)}</span><span class="hs-d">${e.sc&&e.sc!=="1560"?esc(scenLabel(e.sc))+"・":""}${scenClan(e.sc,e.clan)?esc(scenClan(e.sc,e.clan).n)+"家":""}・${e.y}年${SEAS_[e.s]||""}・${"★".repeat(e.lv||0)}</span><b class="hs-s">${num(e.score)}</b></li>`).join("")}</ol>`:`<div class="note" style="margin-top:12px">まだ記録はありません。</div>`}function open(){if(ext)return ext.open();UIX.openSheet({title:"ハイスコア（この端末）",body:el=>{el.innerHTML=NOTE+listHtml()}})}UIX.addTitleButton({id:"hiscore",label:"統一番付",order:15,onClick:open});return{open,calc,load,keep,listHtml,lastName,cleanName,qualifies,setExt:e=>{ext=e}}})();

<script>/* m_treasure.js */

<script>/* m_yami_ichi.js */

,"art","アダムの創造",7e4,"ミケランジェロが1508〜12年に描いたシスティーナ礼拝堂の天井画の一場面。神とアダムの指先が触れる寸前の構図で知られる。","eu"],["yami-art-lastjudgment","art","最後の審判",8e4,"ミケランジェロがシスティーナ礼拝堂の祭壇の壁に描いた大作（1536〜41年）。天国と地獄へ振り分けられる人々が渦を巻く。","eu"],["yami-art-venice-glass","art","ヴェネツィアのガラス杯",7e3,"ヴェネツィアのムラーノ島で作られたガラスの杯。透き通るガラスに細かな飾りをつけ、ヨーロッパの王侯に好まれた。","eu"],["yami-art-globe","art","南蛮の地球儀",12e3,"南蛮人がもたらした地球儀。宣教師から地球が丸いと聞いた信長は、すぐに理屈を飲み込んだと伝えられる。","eu"],["yami-art-portrait","art","油彩の小さな肖像",9e3,"南蛮の画工が油絵の具で描いた小さな肖像。西洋の画法は、宣教師の学校で日本の若者にも教えられた。","eu"],["yami-art-byobu-gold","art","金地の屏風",15e3,"金箔を貼った地に描く屏風。薄暗い座敷でも灯りを受けて輝き、桃山の城や館を飾った。","jp"],["yami-art-sansui","art","水墨の山水図",1e4,"墨の濃淡だけで山や川を描く山水図。室町時代に禅僧の画家が広め、雪舟がその大成者として名高い。","jp"],["yami-art-makie","art","蒔絵の文箱",9e3,"漆で文様を描き、金銀の粉を蒔きつけて仕上げた文箱。手紙や書き物の道具を納めた。","jp"],["yami-art-noh","art","能面",8e3,"能で使う面。わずかに傾けるだけで表情が変わって見えるように彫られている。能は室町時代に観阿弥・世阿弥が大成した。","jp"],["yami-art-rakuchu","art","洛中洛外図屏風",4e4,"京の町と郊外の名所、人々の暮らしを一望に描いた屏風。上杉家に伝わる狩野永徳の筆のものは、信長が謙信に贈ったと伝えられる（国宝）。","jp"],["yami-art-karajishi","art","唐獅子図屏風",35e3,"狩野永徳の筆と伝わる大きな屏風。金地を二頭の唐獅子が悠々と歩む。皇室に伝わり、今は皇居三の丸尚蔵館にある。","jp"],["yami-art-shorin","art","松林図屏風",45e3,"長谷川等伯が描いた水墨の屏風。霧の中に松林が浮かび、余白が多くを語る。東京国立博物館蔵（国宝）。","jp"],["yami-art-choju","art","鳥獣戯画",3e4,"兎や蛙が人のように遊ぶ姿を墨で描いた絵巻。平安時代から鎌倉時代にかけての作で、京都の高山寺に伝わる。","jp"],["yami-art-kongo","art","金剛力士像",4e4,"東大寺南大門に立つ一対の木像。運慶・快慶らが1203年に、わずか70日ほどで造り上げたとされる。","jp"],["yami-art-ashura","art","阿修羅像",5e4,"奈良・興福寺の八部衆の一体で、734年ごろの乾漆の像。三つの顔と六本の腕を持ち、少年のような表情で知られる。","jp"],["yami-art-dogu","art","遮光器土偶",2e4,"縄文時代晩期の土偶。雪の照り返しを防ぐ遮光器のような大きな目から、この名がついた。青森県の亀ヶ岡遺跡のものが名高い。","jp"],["yami-art-haniwa-horse","art","馬形埴輪",12e3,"古墳のまわりに並べられた馬の埴輪。鞍や手綱などの馬具まで、粘土で細かく表している。","jp"],["yami-art-haniwa-dance","art","踊る人々の埴輪",15e3,"埼玉県の野原古墳から出たと伝わる人物の埴輪。片手を上げた姿が踊っているように見え、「踊る埴輪」と呼ばれてきた。","jp"],["yami-art-kaen-doki","art","火焔型土器",25e3,"縄文時代中期の土器。燃え上がる炎のような縁飾りを持ち、新潟県の信濃川の流域で多く見つかっている。","jp"],["yami-art-seika","art","明の青花の壺",18e3,"中国・明の時代に景徳鎮で焼かれた青花（染付）の壺。白い地にコバルトの青で文様を描く。","as"],["yami-art-korai","art","高麗茶碗",14e3,"朝
